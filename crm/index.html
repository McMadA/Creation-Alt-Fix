<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klantenportaal & Inlog - Creation+Alt+Fix</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0e1a;
            --card-bg: rgba(15, 23, 42, 0.85);
            --color-primary: #6366f1;
            --color-accent: #22d3ee;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(255, 255, 255, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(34, 211, 238, 0.15) 0%, transparent 40%);
        }
        .portal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }
        .logo {
            max-width: 130px;
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .accent {
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 28px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .login-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: left;
        }
        .login-box h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }
        .login-box h2 i {
            color: var(--color-accent);
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .input-field {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--color-primary), #4f46e5);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            background: linear-gradient(135deg, #4f46e5, var(--color-accent));
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        .hidden { display: none !important; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        .divider span {
            padding: 0 10px;
        }

        .nav-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.3s ease;
            text-align: left;
        }
        .nav-card:hover {
            border-color: var(--color-accent);
            transform: translateY(-2px);
            background: rgba(34, 211, 238, 0.05);
        }
        .nav-card i {
            font-size: 1.4rem;
            color: var(--color-accent);
            width: 30px;
            text-align: center;
        }
        .nav-card h3 {
            font-size: 1.05rem;
            margin-bottom: 4px;
        }
        .nav-card span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .back-link {
            margin-top: 25px;
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--color-accent);
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <img src="images/logo.png" alt="Creation+Alt+Fix Logo" class="logo">
        <h1>Creation+Alt+Fix <span class="accent">Portal</span></h1>
        <p class="subtitle">Log in om de live status van je project te volgen en je offerte in te zien.</p>

        <!-- Klant Inlog Formulier -->
        <div class="login-box">
            <h2><i class="fas fa-user-lock"></i> Klant Inloggen</h2>
            
            <div id="login-error" class="error-msg hidden"></div>

            <form id="client-login-form">
                <div class="form-group">
                    <label for="client-email"><i class="fas fa-envelope"></i> E-mailadres</label>
                    <input type="email" id="client-email" class="input-field" placeholder="je-naam@bedrijf.nl" required>
                </div>
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label for="client-password" style="margin: 0;"><i class="fas fa-lock"></i> Wachtwoord</label>
                        <a href="#" id="forgot-password-link" style="font-size: 0.8rem; color: var(--color-accent); text-decoration: none;">Wachtwoord vergeten?</a>
                    </div>
                    <input type="password" id="client-password" class="input-field" placeholder="Ontvangen wachtwoord" required>
                </div>
                <button type="submit" id="btn-client-login" class="btn-submit">
                    <i class="fas fa-sign-in-alt"></i> Inloggen op Klantenportaal
                </button>
            </form>
        </div>

        <div class="divider"><span>Nog geen lopend project?</span></div>

        <!-- Intake Link -->
        <a href="intake/" class="nav-card">
            <i class="fas fa-file-signature"></i>
            <div>
                <h3>Project Intake Formulier</h3>
                <span>Start een nieuw project en ontvang direct je inloggegevens</span>
            </div>
        </a>

        <a href="https://creationaltfix.nl" class="back-link">
            <i class="fas fa-arrow-left"></i> Terug naar hoofdwebsite (creationaltfix.nl)
        </a>
    </div>

    <!-- Firebase Auth Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAj2_cXCL6fs9qjp2q89F3ezLbErDp4wI8",
            authDomain: "mythical-cider-475118-e5.firebaseapp.com",
            projectId: "mythical-cider-475118-e5",
            storageBucket: "mythical-cider-475118-e5.firebasestorage.app",
            messagingSenderId: "755599901945",
            appId: "1:755599901945:web:589450049c785dacfcce28"
        };

        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        async function isClient(email, uid) {
            try {
                const q = query(collection(db, "projects"), where("email", "==", (email || '').toLowerCase()));
                const snap = await getDocs(q);
                if (!snap.empty) {
                    const data = snap.docs[0].data();
                    if (data.isClientAccount || data.clientUid === uid) return true;
                }
            } catch (err) {
                console.warn("Fout bij isClient check:", err);
            }
            return false;
        }

        // Automatisch doorsturen als de gebruiker al ingelogd is
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userIsClient = await isClient(user.email, user.uid);
                if (userIsClient) {
                    window.location.href = "status/";
                }
            }
        });

        document.getElementById('client-login-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('client-email').value;
            const password = document.getElementById('client-password').value;
            const btn = document.getElementById('btn-client-login');
            const errDiv = document.getElementById('login-error');

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Bezig met inloggen...';
            btn.disabled = true;
            errDiv.classList.add('hidden');

            try {
                const userCred = await signInWithEmailAndPassword(auth, email, password);
                const userIsClient = await isClient(userCred.user.email, userCred.user.uid);
                if (userIsClient) {
                    window.location.href = "status/";
                } else {
                    window.location.href = "admin/";
                }
            } catch (error) {
                console.error("Login mislukt:", error);
                errDiv.innerText = "Ongeldig e-mailadres of wachtwoord. Controleer je gegevens of de ontvangen e-mail.";
                errDiv.classList.remove('hidden');
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Inloggen op Klantenportaal';
                btn.disabled = false;
            }
        });

        // Wachtwoord Vergeten Handler
        document.getElementById('forgot-password-link')?.addEventListener('click', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('client-email').value;
            const email = prompt("Voer je e-mailadres in om je wachtwoord opnieuw in te stellen:", emailInput || "");
            
            if (email && email.trim()) {
                try {
                    await sendPasswordResetEmail(auth, email.trim());
                    alert(`Een e-mail om je wachtwoord opnieuw in te stellen is verzonden naar ${email.trim()}.\nCheck je inbox (en spambox).`);
                } catch (err) {
                    console.error("Reset error:", err);
                    alert("Kon de reset-mail niet versturen. Controleer of het e-mailadres juist is.");
                }
            }
        });
    </script>

</body>
</html>
