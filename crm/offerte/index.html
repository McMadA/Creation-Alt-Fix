<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate-key="offerteRedirectTitle">Offerte - Creation+Alt+Fix Portaal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0a0e1a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
        }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; margin-bottom: 15px; color: #22d3ee; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 25px; }
        .btn {
            background: #6366f1;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="box">
        <i class="fas fa-user-shield" style="font-size: 2.5rem; color: #6366f1; margin-bottom: 15px;"></i>
        <h1 data-translate-key="offerteRedirectH1">Naar het Klantenportaal</h1>
        <p data-translate-key="offerteRedirectP">Offertes en projectvoorstellen worden voortaan veilig weergegeven in je persoonlijke Creation+Alt+Fix Klantenportaal.</p>
        <a href="../status/index.html" class="btn"><i class="fas fa-sign-in-alt"></i> <span data-translate-key="offerteRedirectBtn">Direct inloggen op Klantenportaal</span></a>
    </div>
    <script>
        const translations = {
            nl: {
                offerteRedirectTitle: "Offerte - Creation+Alt+Fix Portaal",
                offerteRedirectH1: "Naar het Klantenportaal",
                offerteRedirectP: "Offertes en projectvoorstellen worden voortaan veilig weergegeven in je persoonlijke Creation+Alt+Fix Klantenportaal.",
                offerteRedirectBtn: "Direct inloggen op Klantenportaal"
            },
            en: {
                offerteRedirectTitle: "Proposal - Creation+Alt+Fix Portal",
                offerteRedirectH1: "To the Client Portal",
                offerteRedirectP: "Proposals and project quotes are now securely displayed inside your personal Creation+Alt+Fix Client Portal.",
                offerteRedirectBtn: "Directly log into Client Portal"
            }
        };
        const lang = localStorage.getItem('preferredLanguage') || ((navigator.language || 'nl').split('-')[0] === 'en' ? 'en' : 'nl');
        if (translations[lang]) {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-translate-key]').forEach(el => {
                const key = el.getAttribute('data-translate-key');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
        }
        const redirectUrl = "../status/index.html" + window.location.search;
        const redirectBtn = document.querySelector('a[data-translate-key="offerteRedirectBtn"]');
        if (redirectBtn) redirectBtn.href = redirectUrl;

        setTimeout(() => {
            window.location.href = redirectUrl;
        }, 1500);
    </script>
</body>
</html>
