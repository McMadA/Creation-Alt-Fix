name: 🚀 Build, Test & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================================
  # 1. QUALITY GATE: AUTOMATED TEST SUITE (32 TESTS ACROSS 9 SUITES)
  # ============================================================
  test:
    name: 🧪 Automated Test Suite & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🧪 Run All CRM & Core Function Tests
        run: |
          npm test

  # ============================================================
  # 2. OPTIMIZATION & PRODUCTION DEPLOYMENT (FTP + FIREBASE)
  # Only executes if the test suite passes 100% on the main branch!
  # ============================================================
  web-deploy:
    name: 🚀 Optimize & Production Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🖼️ Convert images to WebP
        run: |
          sudo apt-get install -y -qq webp
          shopt -s globstar nullglob
          for file in website/images/*.png website/images/*.jpg crm/**/images/*.png crm/**/images/*.jpg; do
            [ -f "$file" ] && cwebp -q 80 "$file" -o "${file%.*}.webp" || true
          done

      - name: 🗜️ Minify CSS and JS
        run: |
          npm install -g clean-css-cli terser
          shopt -s globstar nullglob
          for file in website/css/*.css crm/**/css/*.css; do
            [ -f "$file" ] && cleancss -o "$file" "$file" || true
          done
          for file in website/js/*.js crm/**/js/*.js; do
            [ -f "$file" ] && terser "$file" -o "$file" --compress --mangle || true
          done

      - name: 📂 Sync Website via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: web0156.zxcs.nl
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./website/
          server-dir: domains/creationaltfix.nl/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/moroccothingie/**
            **/*.prisma

      - name: 📂 Sync CRM & Portaal via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: web0156.zxcs.nl
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./crm/
          server-dir: domains/creationaltfix.nl/public_html/portal/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: 🔥 Deploy Firestore Rules to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYTHICAL_CIDER_475118_E5 }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || [ -n "$FIREBASE_TOKEN" ]; then
            echo "🚀 Deploying updated firestore.rules to Firebase (mythical-cider-475118-e5)..."
            npm install -g firebase-tools
            if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
              echo "$FIREBASE_SERVICE_ACCOUNT" > gcp-key.json
              export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json
              firebase deploy --only firestore:rules --project mythical-cider-475118-e5 --non-interactive
              rm -f gcp-key.json
            else
              firebase deploy --only firestore:rules --project mythical-cider-475118-e5 --token "$FIREBASE_TOKEN" --non-interactive
            fi
            echo "✅ Firestore rules successfully deployed to Firebase!"
          else
            echo "ℹ️ Firebase credentials niet gevonden in GitHub Secrets. Lokale deployment blijft actief."
          fi
